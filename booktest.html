<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mobile Book Viewer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, sans-serif;
}

/* Swipe container */
.gallery{
    width:100vw;
    height:100vh;
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
}

.gallery::-webkit-scrollbar{
    display:none;
}

/* Each page */
.slide{
    flex:0 0 100%;
    width:100vw;
    height:100vh;
    scroll-snap-align:start;
    background:#000;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

/* Page number */
.page-indicator{
    position:fixed;
    top:15px;
    right:15px;
    z-index:100;
    background:rgba(0,0,0,.65);
    color:#fff;
    padding:8px 14px;
    border-radius:30px;
    font-size:14px;
    backdrop-filter:blur(5px);
}

/* Swipe hint */
.swipe-hint{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    background:rgba(0,0,0,.75);
    color:white;
    padding:12px 20px;
    border-radius:999px;
    font-size:15px;
    pointer-events:none;

    animation:
        swipeDemo 2s ease-in-out infinite,
        fadeOut 1s ease 5s forwards;
}

@keyframes swipeDemo{
    0%,100%{
        transform:translateX(-50%);
    }
    25%{
        transform:translateX(-65%);
    }
    75%{
        transform:translateX(-35%);
    }
}

@keyframes fadeOut{
    to{
        opacity:0;
        visibility:hidden;
    }
}

/* Edge fades */
.left-fade,
.right-fade{
    position:fixed;
    top:0;
    width:40px;
    height:100%;
    z-index:50;
    pointer-events:none;
}

.left-fade{
    left:0;
    background:linear-gradient(
        to right,
        rgba(255,255,255,.15),
        transparent
    );
}

.right-fade{
    right:0;
    background:linear-gradient(
        to left,
        rgba(255,255,255,.15),
        transparent
    );
}
</style>
</head>
<body>

<div class="page-indicator">
    <span id="currentPage">1</span> /
    <span id="totalPages">5</span>
</div>

<div class="swipe-hint">
    👈 Swipe to turn pages 👉
</div>

<div class="left-fade"></div>
<div class="right-fade"></div>

<div class="gallery" id="gallery">

    <div class="slide">
        <img src="./1.jpg" alt="">
    </div>

    <div class="slide">
        <img src="./2.jpg" alt="">
    </div>

    <div class="slide">
        <img src="./3.jpg" alt="">
    </div>

    <div class="slide">
        <img src="./4.jpg" alt="">
    </div>

    <div class="slide">
        <img src="./hero.jpg" alt="">
    </div>

</div>

<script>
const gallery = document.getElementById('gallery');
const slides = document.querySelectorAll('.slide');
const currentPage = document.getElementById('currentPage');
const totalPages = document.getElementById('totalPages');
const hint = document.querySelector('.swipe-hint');

totalPages.textContent = slides.length;

gallery.addEventListener('scroll', () => {
    const page =
        Math.round(gallery.scrollLeft / window.innerWidth) + 1;

    currentPage.textContent = page;
});

gallery.addEventListener('touchstart', () => {
    if(hint){
        hint.style.transition = 'opacity .3s';
        hint.style.opacity = '0';
    }
}, { once:true });
</script>

</body>
</html>
